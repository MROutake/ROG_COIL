[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcb-rogowski"
version = "0.1.0"
description = "PCB Rogowski Coil Analysis Tool – professionelles Analysetool für PCB-basierte Rogowski-Spulen"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Anders" },
]
keywords = ["rogowski", "pcb", "coil", "inductance", "odb", "altium"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "matplotlib>=3.8",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "pydantic>=2.6",
  "gerbonara>=1.0",
  "PyQt6>=6.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-qt>=4.4",
  "ruff>=0.4",
  "black>=24.0",
  "mypy>=1.9",
  "pre-commit>=3.7",
  "types-PyYAML",
]

[project.scripts]
pcb-rogowski = "pcb_rogowski.main:main"
pcb-rogowski-gui = "pcb_rogowski.main:main_gui"

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# ruff – Linting & Import-Sorting
# ---------------------------------------------------------------------------
[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "ANN", # flake8-annotations (type hints)
]
ignore = [
  "ANN201",  # Missing return type annotation for public function
  "ANN001",  # Missing type annotation for function argument (relaxed for tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

# ---------------------------------------------------------------------------
# black – Formatierung
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py311"]

# ---------------------------------------------------------------------------
# mypy – statische Typprüfung
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
mypy_path = "src"

# ---------------------------------------------------------------------------
# pytest – Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -v"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
  "integration: marks tests as integration tests (may be slow)",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 70
